name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - 'studio-bristol-inn-vt/**'
      - '.github/workflows/deploy-studio.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: studio-bristol-inn-vt/package-lock.json

      - name: Install studio dependencies
        working-directory: studio-bristol-inn-vt
        run: npm ci

      - name: Deploy studio
        working-directory: studio-bristol-inn-vt
        run: npm run deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_DEPLOY_API_URL: ${{ secrets.SANITY_STUDIO_DEPLOY_API_URL }}
          SANITY_STUDIO_DEPLOY_TRIGGER_TOKEN: ${{ secrets.SANITY_STUDIO_DEPLOY_TRIGGER_TOKEN }}
          SANITY_STUDIO_SITE_URL: ${{ vars.SANITY_STUDIO_SITE_URL }}
          SANITY_STUDIO_PREVIEW_SECRET: ${{ secrets.SANITY_STUDIO_PREVIEW_SECRET }}
